# Default translation rules: every mandatory IMS↔5GC path.
# Hot-reload: PUT /admin/v1/rules (provisioning role) — validated before
# activation; a rejected document never disturbs live traffic.
rules:
  # Cx UAR → Nudm_UECM registration query (TS 29.229 §6.1.1 / TS 29.503 §5.3)
  - id: cx_uar_to_udm_identity_query
    trigger:
      diameter_application: 16777216   # Cx
      command_code: 300                # UAR
    actions:
      - extract: { avp: "User-Name", as: impi }
      - extract: { avp: "Public-Identity", as: impu }
      - http_request:
          method: GET
          nf_type: UDM
          path: "/nudm-uecm/v1/{impi}/registrations"
          query:
            impu: "{impu}"
      - map_response:
          200: build_uaa_success
          404: build_uaa_user_unknown
          503: build_uaa_unable_to_comply
          default: build_uaa_unable_to_comply
    version: "3gpp-rel18"

  # Cx SAR → Nudm_SDM access-and-mobility data (TS 29.229 §6.1.3 / TS 29.503 §5.2)
  - id: cx_sar_to_udm_am_data
    trigger:
      diameter_application: 16777216
      command_code: 301                # SAR
    actions:
      - extract: { avp: "User-Name", as: impi }
      - http_request:
          method: GET
          nf_type: UDM
          path: "/nudm-sdm/v2/{impi}/am-data"
      - map_response:
          200: build_success
          404: build_user_unknown
          default: build_unable_to_comply
    version: "3gpp-rel18"

  # Cx LIR → Nudm_UECM location/registration query (TS 29.229 §6.1.5)
  - id: cx_lir_to_udm_location_query
    trigger:
      diameter_application: 16777216
      command_code: 302                # LIR
    actions:
      - extract: { avp: "Public-Identity", as: impu }
      - http_request:
          method: GET
          nf_type: UDM
          path: "/nudm-uecm/v1/{impu}/registrations"
      - map_response:
          200: build_uaa_success      # carries Server-Name like UAA
          404: build_user_unknown
          default: build_unable_to_comply
    version: "3gpp-rel18"

  # Cx MAR → Nausf_UEAuthentication (TS 29.229 §6.1.7 / TS 29.509 §5.2)
  # POST is never retried (non-idempotent: each call consumes an AV).
  - id: cx_mar_to_ausf_authentication
    trigger:
      diameter_application: 16777216
      command_code: 303                # MAR
    actions:
      - extract: { avp: "User-Name", as: impi }
      - http_request:
          method: POST
          nf_type: AUSF
          path: "/nausf-auth/v1/ue-authentications"
          body:
            supiOrSuci: "{impi}"
            servingNetworkName: "5G:ims"
      - map_response:
          200: build_maa_success
          201: build_maa_success
          404: build_user_unknown
          default: build_unable_to_comply
    version: "3gpp-rel18"

  # Cx RTR → Namf_Communication N1N2 transfer for IMS deregistration
  # (TS 29.229 §6.1.9 / TS 29.518 §5.2.2.3)
  - id: cx_rtr_to_amf_deregistration
    trigger:
      diameter_application: 16777216
      command_code: 304                # RTR
    actions:
      - extract: { avp: "User-Name", as: impi }
      - http_request:
          method: POST
          nf_type: AMF
          path: "/namf-comm/v1/ue-contexts/{impi}/n1-n2-messages"
          body:
            n1MessageContainer:
              n1MessageClass: "SMS"   # placeholder container per operator profile
      - map_response:
          200: build_success
          202: build_success
          404: build_user_unknown
          default: build_unable_to_comply
    version: "3gpp-rel18"

  # Sh UDR → Nudr_DataRepository read (TS 29.329 §6.1.1 / TS 29.504 §5.2)
  - id: sh_udr_to_udr_data_read
    trigger:
      diameter_application: 16777217   # Sh
      command_code: 306                # UDR
    actions:
      - extract: { avp: "User-Name", as: impi, required: false }
      - http_request:
          method: GET
          nf_type: UDR
          path: "/nudr-dr/v1/subscription-data"
      - map_response:
          200: build_uda_success
          404: build_user_unknown
          default: build_unable_to_comply
    version: "3gpp-rel18"

  # Sh PUR → Nudr_DataRepository update (TS 29.329 §6.1.3 / TS 29.504 §5.2)
  # PUT is idempotent and retry-safe.
  - id: sh_pur_to_udr_data_update
    trigger:
      diameter_application: 16777217
      command_code: 307                # PUR
    actions:
      - extract: { avp: "User-Name", as: impi, required: false }
      - extract: { avp: "User-Data", as: user_data }
      - http_request:
          method: PUT
          nf_type: UDR
          path: "/nudr-dr/v1/subscription-data"
          body:
            repositoryData: "{user_data}"
      - map_response:
          200: build_success
          201: build_success
          204: build_success
          404: build_user_unknown
          default: build_unable_to_comply
    version: "3gpp-rel18"
