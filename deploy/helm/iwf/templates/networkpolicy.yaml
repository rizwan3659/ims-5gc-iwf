{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iwf.fullname" . }}
  labels: {{- include "iwf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "iwf.fullname" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.imsZoneLabel | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3868 }
    - ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 9090 }
{{- end }}
